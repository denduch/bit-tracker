<!DOCTYPE html>
<html>
<head>
    <title>Bit Tracker</title>
  <script type="module" crossorigin src="/popup/popup.js"></script>
  <link rel="stylesheet" crossorigin href="/popup.css">
</head>
<body>
    <div class="settings-container">
        <label class="toggle-switch">
            <input type="checkbox" id="mock-toggle">
            <span class="slider"></span>
        </label>
        <span>Use Mocks</span>
    </div>
    <tab-view>
        <artists-view class="panel" slot="artists"></artists-view>
        <events-view class="panel" slot="events"></events-view>
    </tab-view>
</body>
</html>
